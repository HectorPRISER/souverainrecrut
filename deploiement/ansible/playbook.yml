---
# Préparation du serveur de déploiement SouverainRecrut (Ubuntu) :
#   mises à jour, Docker Engine + plugin Compose, service actif, répertoires de déploiement,
#   pare-feu UFW, vérifications.
# Idempotent : relançable sans effet de bord.
#
#   ansible-playbook -i inventory.ini playbook.yml
#   ansible-playbook -i inventory.ini playbook.yml --tags verify     # vérifications seules
#   ansible-playbook -i inventory.ini playbook.yml -e firewall_enabled=false

- name: Préparer le serveur de déploiement
  hosts: deploy_servers
  become: true

  vars:
    upgrade_system: true
    firewall_enabled: true
    api_ports: [4000, 4001]          # production, staging
    environments: [production, staging]
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    env_dirs: "{{ environments | map('regex_replace', '^', deploy_dir ~ '/') | list }}"
    docker_apt_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"

  pre_tasks:
    - name: Vérifier que la cible est un Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
        fail_msg: "Ce playbook cible Ubuntu (détecté : {{ ansible_facts['distribution'] }})."
        success_msg: "Ubuntu {{ ansible_facts['distribution_version'] }} détecté."

    - name: Vérifier que l'utilisateur de déploiement existe (créé à l'installation)
      ansible.builtin.getent:
        database: passwd
        key: "{{ ansible_user }}"

  tasks:
    # --- Système -----------------------------------------------------------------
    - name: Mettre à jour l'index des paquets
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Mettre à jour le système
      ansible.builtin.apt:
        upgrade: dist
      when: upgrade_system | bool

    - name: Installer les dépendances nécessaires
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - ufw
        state: present

    # --- Docker Engine (dépôt officiel) -------------------------------------------
    - name: Créer le répertoire des clés APT
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Récupérer la clé GPG officielle de Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Ajouter le dépôt APT officiel de Docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
        filename: docker
        state: present
        update_cache: true

    - name: Installer Docker Engine et le plugin Compose
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present

    - name: Activer et démarrer le service Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Autoriser l'utilisateur de déploiement à utiliser Docker
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    # --- Répertoires de déploiement -------------------------------------------------
    - name: Créer le répertoire de déploiement et un dossier par environnement
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0750"
      loop: "{{ [deploy_dir] + env_dirs }}"

    # --- Pare-feu --------------------------------------------------------------------
    # Ordre important : autoriser SSH AVANT d'activer le pare-feu, sinon perte d'accès.
    - name: Autoriser SSH
      community.general.ufw:
        rule: allow
        port: "{{ ansible_port | default(22) }}"
        proto: tcp
      when: firewall_enabled | bool

    - name: Autoriser les ports de l'API (production et staging)
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ api_ports }}"
      when: firewall_enabled | bool

    - name: Activer UFW (refus du trafic entrant par défaut)
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming
      when: firewall_enabled | bool

  post_tasks:
    # --- Vérifications ----------------------------------------------------------------
    - name: Vérifier le fonctionnement des services
      tags: [verify]
      block:
        - name: Service Docker actif et activé au démarrage
          ansible.builtin.systemd:
            name: docker
          register: docker_unit
          failed_when: docker_unit.status.ActiveState != 'active' or docker_unit.status.UnitFileState != 'enabled'

        - name: Version de Docker Engine
          ansible.builtin.command: docker --version
          register: docker_version
          changed_when: false

        - name: Version du plugin Compose
          ansible.builtin.command: docker compose version
          register: compose_version
          changed_when: false

        - name: Le démon Docker répond
          ansible.builtin.command: docker info --format '{% raw %}{{.ServerVersion}}{% endraw %}'
          register: docker_info
          changed_when: false

        - name: Utilisateur de déploiement dans le groupe docker
          ansible.builtin.command: "id -nG {{ ansible_user }}"
          register: user_groups
          changed_when: false
          failed_when: "'docker' not in user_groups.stdout.split()"

        - name: Répertoires de déploiement présents
          ansible.builtin.stat:
            path: "{{ item }}"
          loop: "{{ env_dirs }}"
          register: deploy_dirs
          failed_when: not deploy_dirs.stat.exists or not deploy_dirs.stat.isdir

        - name: Statut du pare-feu
          ansible.builtin.command: ufw status
          environment:
            LC_ALL: C      # sortie en anglais quelle que soit la langue du serveur
          register: ufw_status
          changed_when: false
          failed_when: "firewall_enabled | bool and 'Status: active' not in ufw_status.stdout"

        - name: Résumé
          ansible.builtin.debug:
            msg:
              - "{{ docker_version.stdout }}"
              - "{{ compose_version.stdout }}"
              - "Démon Docker : {{ docker_info.stdout }}"
              - "Dossiers : {{ env_dirs | join(', ') }}"
              - "UFW : {{ (ufw_status.stdout_lines | first) | default('inconnu') }}"

[defaults]
inventory = inventory.ini
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
# Évite l'avertissement remote_tmp lors de l'élévation de privilèges (become)
remote_tmp = /tmp/.ansible/tmp

[ssh_connection]
# Accepte la clé d'hôte au premier contact, puis refuse tout changement (protection contre l'usurpation)
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
pipelining = True

# Analyse SonarQube du backend SouverainRecrut.
# Lancement depuis la racine du dépôt :
#   sonar-scanner -Dproject.settings=integration-continue/sonar/sonar-project.properties
# (host.url et token sont fournis par Jenkins via withSonarQubeEnv, jamais dans ce fichier)

sonar.projectKey=souverainrecrut-backend
sonar.projectName=SouverainRecrut Backend
sonar.projectBaseDir=backend

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts
sonar.sourceEncoding=UTF-8

# Rapport de couverture produit par Jest (npm run test:ci)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Bootstrap HTTP et définitions OpenAPI : pas de logique à couvrir
sonar.coverage.exclusions=src/server.ts,src/docs/**,src/types/**,prisma/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Définitions OpenAPI déclaratives (structures répétitives par nature) : hors détection de duplications
sonar.cpd.exclusions=src/docs/**

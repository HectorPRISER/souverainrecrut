# Stack CI locale : Jenkins + SonarQube (+ sa base PostgreSQL).
#   cp .env.example .env   # puis renseigner les valeurs
#   docker compose up -d --build
name: souverainrecrut-ci

services:
  jenkins:
    build: .
    container_name: jenkins
    user: root
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?défini dans .env}
      DOCKERHUB_USER: ${DOCKERHUB_USER:-hectorpriser}
      DOCKERHUB_TOKEN: ${DOCKERHUB_TOKEN:-changeme}
      SONAR_TOKEN: ${SONAR_TOKEN:-changeme}
      GIT_REPO_URL: ${GIT_REPO_URL:-https://github.com/HectorPRISER/souverainrecrut.git}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [ci-net]
    depends_on: [sonarqube]

  sonarqube:
    image: sonarqube:10.7.0-community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      # Évite de devoir régler vm.max_map_count sur l'hôte (usage local uniquement)
      SONAR_SEARCH_JAVAADDITIONALOPTS: -Dnode.store.allow_mmap=false
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
    networks: [ci-net]
    depends_on:
      sonar-db:
        condition: service_healthy

  sonar-db:
    image: postgres:16-alpine
    container_name: sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data
    networks: [ci-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  ci-net:
    # Nom fixe : le pipeline y rattache le conteneur PostgreSQL de test
    name: ci-net

volumes:
  jenkins_home:
  sonar_data:
  sonar_extensions:
  sonar_db:
